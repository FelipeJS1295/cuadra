# Cuadra en el VPS (erp.budly.cl). Se usa desde la carpeta del proyecto:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d
# Postgres no se publica fuera del servidor; la API y la web solo en 127.0.0.1 (entra Nginx).
name: cuadra

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - cuadra_pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./respaldos:/respaldos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      target: api
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: cuadra-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WEB_ORIGIN: ${WEB_ORIGIN}
      AUTH_SECRET: ${AUTH_SECRET}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      TZ: America/Santiago
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4290}:4200"

  web:
    build:
      context: ..
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: cuadra-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TZ: America/Santiago
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3290}:3200"

volumes:
  cuadra_pgdata:
